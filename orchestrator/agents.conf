# orchestrator config — sourced by orchestrate.sh
# CLI-agnostic: swap AGENT_CLI without touching the harness.

# Which coding CLI+model the WORKER agents run on. 10 backends:
#   kimi-flash         — kimi CLI, deepseek-v4-flash          (cheapest; default)
#   kimi-pro           — kimi CLI, deepseek-v4-pro            (cheap pro, ~4x cheaper than claude-code)
#   command-flash      — commandcode, deepseek-v4-flash
#   command-pro        — commandcode, deepseek-v4-pro
#   opencode-bigpickle — opencode, free Zen "big-pickle"      (NOT gemini)
#   opencode-flash     — opencode, deepseek-v4-flash
#   opencode-pro       — opencode, deepseek-v4-pro
#   claude-flash       — claude code on deepseek-v4-flash (via ANTHROPIC_* env)
#   claude-pro         — claude code on deepseek-v4-pro   (via ANTHROPIC_* env)  [was claude-deepseek]
#   claude-frontier    — claude code on Anthropic frontier (real claude)
#
# Backward-compat aliases: kimi=kimi-flash, opencode=opencode-bigpickle, claude=claude-frontier,
# claude-deepseek=claude-pro.
AGENT_CLI="${AGENT_CLI:-kimi-flash}"

# DeepSeek API key for the claude-pro/claude-flash (claude-code-on-deepseek) adapters.
# Sourced from orchestrator/.env (gitignored) — NEVER exported into the orchestrator's own shell,
# only into the worker subprocess below (else it would hijack THIS Claude session onto deepseek).
[ -f "$(dirname "${BASH_SOURCE[0]}")/.env" ] && . "$(dirname "${BASH_SOURCE[0]}")/.env"

# Model override (optional; empty = the adapter's default below).
MODEL_WORKER="${MODEL_WORKER:-}"

# Max worker agents running at once (token/cost throttle).
MAX_PARALLEL="${MAX_PARALLEL:-3}"

# Where per-branch git worktrees are created (sibling to the repo).
WT_BASE="${WT_BASE:-../xuper-wt}"

# ---- adapter: build the headless launch argv for the chosen CLI ----
# Args: $1 = prompt text (already read from the task file), $2 = model (may be empty)
# Prints nothing; execs the CLI in the foreground of its subshell (caller backgrounds it).
agent_exec() {
  local prompt="$1" model="$2"

  # kimi backends (headless -p; kimi forbids --auto/-y with -p, so bare -p is correct)
  case "$AGENT_CLI" in
    kimi|kimi-flash)
      kimi -p "$prompt" --output-format text ${model:+-m "$model"}
      return
      ;;
    kimi-pro)
      kimi -p "$prompt" --output-format text -m "${model:-deepseek/deepseek-v4-pro}"
      return
      ;;
  esac

  # commandcode backends (binary is `commandcode`; `cmd` collides with cmd.exe on Windows)
  case "$AGENT_CLI" in
    command-flash)
      commandcode -p "$prompt" -m "${model:-deepseek/deepseek-v4-flash}" --auto-accept --skip-onboarding
      return
      ;;
    command-pro)
      commandcode -p "$prompt" -m "${model:-deepseek/deepseek-v4-pro}" --auto-accept --skip-onboarding
      return
      ;;
  esac

  # opencode backends (headless `opencode run`; zen big-pickle default, no gemini)
  case "$AGENT_CLI" in
    opencode|opencode-bigpickle)
      opencode run "$prompt" ${model:+-m "$model"} -m "${model:-opencode/big-pickle}"
      return
      ;;
    opencode-flash)
      opencode run "$prompt" -m "${model:-opencode/deepseek-v4-flash}"
      return
      ;;
    opencode-pro)
      opencode run "$prompt" -m "${model:-opencode/deepseek-v4-pro}"
      return
      ;;
  esac

  # claude-code-on-deepseek backends (env scoped to THIS subshell only — never leaks to orchestrator)
  case "$AGENT_CLI" in
    claude-pro|claude-deepseek|claude-flash)
      [ -n "${DEEPSEEK_API_KEY:-}" ] || { echo "orchestrator: DEEPSEEK_API_KEY not set (put it in orchestrator/.env)" >&2; return 2; }
      local dm
      case "$AGENT_CLI" in claude-flash) dm="${model:-deepseek-v4-flash}";; *) dm="${model:-deepseek-v4-pro}";; esac
      ANTHROPIC_BASE_URL="https://api.deepseek.com/anthropic" \
      ANTHROPIC_AUTH_TOKEN="$DEEPSEEK_API_KEY" \
      ANTHROPIC_MODEL="$dm" \
      ANTHROPIC_DEFAULT_OPUS_MODEL="$dm" \
      ANTHROPIC_DEFAULT_SONNET_MODEL="$dm" \
      ANTHROPIC_DEFAULT_HAIKU_MODEL="$dm" \
      CLAUDE_CODE_SUBAGENT_MODEL="$dm" \
      CLAUDE_CODE_EFFORT_LEVEL="max" \
        claude -p "$prompt" --permission-mode acceptEdits
      return
      ;;
  esac

  # Anthropic frontier
  case "$AGENT_CLI" in
    claude|claude-frontier)
      if [ -n "$model" ]; then claude -p "$prompt" --permission-mode acceptEdits --model "$model"
      else claude -p "$prompt" --permission-mode acceptEdits; fi
      return
      ;;
  esac

  echo "orchestrator: unknown AGENT_CLI='$AGENT_CLI'" >&2
  return 2
}
