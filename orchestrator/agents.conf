# orchestrator config — sourced by orchestrate.sh
# CLI-agnostic: swap AGENT_CLI without touching the harness.

# Which coding CLI the WORKER agents run on: kimi | claude | claude-deepseek | opencode
#   kimi           — deepseek via kimi's own config (cheapest; default worker)
#   claude         — Claude Code on Anthropic (frontier; expensive)
#   claude-deepseek— Claude Code pointed at DeepSeek's Anthropic-compatible API:
#                    main/opus/sonnet = deepseek-v4-PRO, haiku/subagents = deepseek-v4-FLASH.
#                    Use for HARD convergence tasks (pro reasons better than flash) or when you
#                    want Claude Code's subagent/skill machinery on a deepseek backend.
#   opencode       — opencode run (headless; non-interactive by default). Model via -m provider/model.
AGENT_CLI="${AGENT_CLI:-kimi}"

# For claude-deepseek: DeepSeek API key (platform.deepseek.com/api_keys). Sourced from
# orchestrator/.env (gitignored) — NEVER exported into the orchestrator's own shell, only
# into the worker subprocess below (else it would hijack THIS Claude session onto deepseek).
[ -f "$(dirname "${BASH_SOURCE[0]}")/.env" ] && . "$(dirname "${BASH_SOURCE[0]}")/.env"

# Model alias passed to the worker CLI (empty = the CLI's own default).
# Keep the orchestrator (this Claude session) on the expensive model;
# workers should be cheaper. Set per your kimi config.toml aliases.
MODEL_WORKER="${MODEL_WORKER:-}"

# Max worker agents running at once (token/cost throttle).
MAX_PARALLEL="${MAX_PARALLEL:-3}"

# Where per-branch git worktrees are created (sibling to the repo).
WT_BASE="${WT_BASE:-../xuper-wt}"

# ---- adapter: build the headless launch argv for the chosen CLI ----
# Args: $1 = prompt text (already read from the task file), $2 = model (may be empty)
# Prints nothing; execs the CLI in the foreground of its subshell (caller backgrounds it).
agent_exec() {
  local prompt="$1" model="$2"
  case "$AGENT_CLI" in
    kimi)
      # headless print mode. kimi forbids --auto/-y together with -p; -p is already
      # non-interactive and handles tool permissions with its headless default policy.
      if [ -n "$model" ]; then
        kimi -p "$prompt" --output-format text -m "$model"
      else
        kimi -p "$prompt" --output-format text
      fi
      ;;
    claude)
      if [ -n "$model" ]; then
        claude -p "$prompt" --permission-mode acceptEdits --model "$model"
      else
        claude -p "$prompt" --permission-mode acceptEdits
      fi
      ;;
    claude-deepseek)
      # env is scoped to THIS subshell only (inline prefix) — does not leak to the orchestrator.
      [ -n "${DEEPSEEK_API_KEY:-}" ] || { echo "orchestrator: DEEPSEEK_API_KEY not set (put it in orchestrator/.env)" >&2; return 2; }
      ANTHROPIC_BASE_URL="https://api.deepseek.com/anthropic" \
      ANTHROPIC_AUTH_TOKEN="$DEEPSEEK_API_KEY" \
      ANTHROPIC_MODEL="${model:-deepseek-v4-pro}" \
      ANTHROPIC_DEFAULT_OPUS_MODEL="deepseek-v4-pro" \
      ANTHROPIC_DEFAULT_SONNET_MODEL="deepseek-v4-pro" \
      ANTHROPIC_DEFAULT_HAIKU_MODEL="deepseek-v4-flash" \
      CLAUDE_CODE_SUBAGENT_MODEL="deepseek-v4-flash" \
      CLAUDE_CODE_EFFORT_LEVEL="max" \
        claude -p "$prompt" --permission-mode acceptEdits
      ;;
    opencode)
      # opencode run is headless/non-interactive; -m provider/model selects the backend.
      if [ -n "$model" ]; then
        opencode run "$prompt" -m "$model"
      else
        opencode run "$prompt"
      fi
      ;;
    *)
      echo "orchestrator: unknown AGENT_CLI='$AGENT_CLI'" >&2
      return 2
      ;;
  esac
}
